<!doctype html><html lang="it"><meta charset="utf-8"><title>Anteprima telefono #71</title>
<style>
@font-face{font-family:Fredoka;src:url(Fredoka-SemiBold.ttf);font-weight:600}@font-face{font-family:Fredoka;src:url(Fredoka-Bold.ttf);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:Fredoka;background:#2B2230}
#scrim{position:absolute;inset:0;background:rgba(43,34,48,.35);display:flex;align-items:center;justify-content:center}
/* unità del telefono = px di riferimento 900×1600 (DioramaSolare.uss), scalate come PhoneController */
#frame{width:900px;height:1600px;flex-shrink:0;transform-origin:center}
#phone{width:100%;height:100%;border-radius:96px;padding:24px;border:4px solid #3B2F2A;background:#74503A url(tex_wood_panel.png) center/100% 100%;display:flex}
#screen{flex-grow:1;border-radius:76px;padding:40px 44px;border:3px solid #3B2F2A;background:#F3E3C3 url(tex_cardboard_panel.png) center/100% 100%;overflow:hidden}
#header{height:96px;display:flex;align-items:center}
#back{width:96px;height:96px}
#home-day{font-weight:700;font-size:30px;letter-spacing:1px}
#home-time{font-weight:700;font-size:120px;letter-spacing:-2px;line-height:1.1}
#home-installment{font-size:28px;margin-bottom:24px}
.phone-card{background:#E8D3AC;border:3px solid #3B2F2A;border-radius:44px;padding:26px 30px;margin-bottom:20px;font-size:30px;min-height:40px}
.app-grid{display:flex;flex-wrap:wrap;justify-content:space-between;margin:20px 0}
.tile{width:31%;height:230px;border-radius:44px;margin-bottom:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #3B2F2A}
.tile i{width:84px;height:84px;background:center/contain no-repeat}
.tile b{font-size:26px;margin-top:10px;color:#3B2A20}
.m{background:#8FC9A8}.o{background:#F7E26B}.f{background:#F4C430}.q{background:#F3E3C3}.b{background:#C8633B}.r{background:#B9A7C9}
/* PRIMA: colori "notte" di DioramaSolare (cream-hi #FFF9EE) */
.prima #home-day,.prima #home-time,.prima .phone-card{color:#FFF9EE}.prima #home-installment{color:#F3E3C3}
/* DOPO: Phone.uss #71 */
.dopo #home-day,.dopo #home-time,.dopo .phone-card{color:#3B2A20}.dopo #home-installment{color:#7A4A2E}
.dopo .vuoto{display:none}
</style>
<body><div id="scrim"><div id="frame"><div id="phone"><div id="screen">
<div id="header"><div id="back"></div></div>
<div id="home-day">Giorno 1/365 · Solara</div><div id="home-time">08:00</div>
<div id="home-installment" class="__inst"></div>
<div class="phone-card vuoto" id="notif"></div>
<div class="app-grid">
<div class="tile m"><i style="background-image:url(ic_chat.png)"></i><b>Messaggi</b></div>
<div class="tile o"><i style="background-image:url(ic_box.png)"></i><b>Ordini</b></div>
<div class="tile f"><i style="background-image:url(ic_robot.png)"></i><b>Flotta</b></div>
<div class="tile q"><i style="background-image:url(ic_customer.png)"></i><b>Quartiere</b></div>
<div class="tile b"><i style="background-image:url(ic_bag.png)"></i><b>Bottega</b></div>
<div class="tile r"><i style="background-image:url(ic_lock.png)"></i><b>Razzo</b></div>
</div>
<div class="phone-card vuoto" id="quest"></div>
</div></div></div></div>
<script>
const q=new URLSearchParams(location.search);document.body.classList.add(q.get('v')||'dopo');
if(q.get('inst')){const e=document.getElementById('home-installment');e.textContent=q.get('inst');}
if(q.get('quest')){const e=document.getElementById('quest');e.textContent=q.get('quest');e.classList.remove('vuoto');}
const s=Math.min(innerWidth*0.94/900,innerHeight*0.94/1600);document.getElementById('frame').style.transform=`scale(${s})`;
</script></body></html>
