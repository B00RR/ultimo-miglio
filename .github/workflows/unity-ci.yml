# Pipeline Ultimo Miglio (issue #12)
# - Ogni PR verso main: test EditMode + PlayMode (game-ci) e commento con l'esito sulla PR.
# - PR verso main: EditMode sempre, PlayMode solo se cambiano gameplay/scene/prefab/pacchetti/impostazioni (una sola invocazione game-ci) + commento.
# - Push su main e avvio manuale: test + build WebGL (verifica, artifact). Le modifiche solo .md/docs non avviano la CI.
# - Deploy su B00RR/ultimo-miglio-web (GitHub Pages) in radice SOLO con avvio manuale (workflow_dispatch).
# - Preview /dev/ (issue #179): a ogni push su main il job deploy-dev pubblica la build SOLO in dev/ (mai radice o prova/).
# game-ci v4 con licenza Personal vuole UNITY_LICENSE (.ulf) + UNITY_EMAIL/UNITY_PASSWORD: senza .ulf la build si ferma con
# "Missing Unity License File and no Serial was found" (run 38865014865). Con la .ulf i test erano verdi (run 38757501264).
# Secret richiesti: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD; PAGES_DEPLOY_KEY (deploy key con scrittura sul repo web).
name: Unity CI (WebGL)
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
# Una run per workflow+ref; si annullano solo le run vecchie delle PR, mai i push su main o gli avvii manuali.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UNITY_VERSION: 6000.3.26f1
  TZ: Europe/Rome

jobs:
  licenza:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          L: ${{ secrets.UNITY_LICENSE }}
          E: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mancano=""
          [ -n "$L" ] || mancano="$mancano UNITY_LICENSE"
          [ -n "$E" ] || mancano="$mancano UNITY_EMAIL"
          [ -n "$P" ] || mancano="$mancano UNITY_PASSWORD"
          if [ -z "$mancano" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::error::Secret mancanti:$mancano. Vedi LEGGIMI_BUILD.md §3."; exit 1; fi

  # Sulle PR PlayMode solo se cambiano gameplay/scene/prefab/test PlayMode/pacchetti/impostazioni; push e avvio manuale: tutto
  modifiche:
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read }
    outputs:
      playmode: ${{ github.event_name != 'pull_request' || steps.f.outputs.playmode == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: f
        if: github.event_name == 'pull_request'
        with:
          filters: |
            playmode:
              - 'Assets/_Game/Scripts/**'
              - 'Assets/_Game/Data/**'
              - '.github/workflows/**'
              - 'Assets/_Game/Scenes/**'
              - 'Assets/_Game/Prefabs/**'
              - 'Assets/_Game/Tests/PlayMode/**'
              - 'Packages/**'
              - 'ProjectSettings/**'

  test:
    needs: [licenza, modifiche]
    if: needs.licenza.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      # testMode all = una sola importazione di Library per EditMode + PlayMode (più veloce di una matrice: niente doppio pull/import)
      - name: Modalità test
        id: modo
        run: echo "mode=${{ needs.modifiche.outputs.playmode == 'true' && 'all' || 'editmode' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      # LFS con cache: si scaricano solo gli oggetti nuovi (risparmio banda LFS)
      - name: Elenco oggetti LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      # Cache Library: hit verificato (run 38908075647, ~780 MB in 10 s). Restore/save separati per salvarla anche con test rossi
      - uses: actions/cache/restore@v4
        id: lib
        with:
          path: Library
          # Chiave stabile (progetto nella radice del repo): cambia solo con pacchetti/impostazioni
          key: Library-${{ runner.os }}-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-test-
      - uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ steps.modo.outputs.mode }}
          # Immagine con modulo WebGL: gli script Editor usano UnityEditor.WebGL
          customImage: unityci/editor:ubuntu-6000.3.26f1-webgl-3
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Unity
      - uses: actions/cache/save@v4
        if: always() && steps.lib.outputs.cache-hit != 'true'
        with:
          path: Library
          key: ${{ steps.lib.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results }

  commento:
    needs: [licenza, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: test-results, path: test-results }
        continue-on-error: true
      - name: Commenta la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UM_REPO: ${{ github.repository }}
          LICENZA_OK: ${{ needs.licenza.outputs.ok }}
        run: |
          mkdir -p Logs
          for f in $(find test-results -name '*.xml' 2>/dev/null); do
            case "$f" in *[Ee]dit[Mm]ode*) cp "$f" Logs/editmode-results.xml;; *[Pp]lay[Mm]ode*) cp "$f" Logs/playmode-results.xml;; esac
          done
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ "$LICENZA_OK" = true ] || export UM_NOTA="⚠️ Test non eseguiti: licenza Unity non configurata nei secret (vedi LEGGIMI_BUILD.md §3)."
          tools/pr_comment.sh ${{ github.event.pull_request.number }} "" "$RUN"

  build:
    needs: licenza
    # Sulle PR niente build WebGL (solo test): build su push a main e avvio manuale
    if: needs.licenza.outputs.ok == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # ubuntu-24.04 ha già ~86 GB liberi (run 38908075647): free-disk-space (1-2,5 min) non serve più
      - uses: actions/checkout@v4
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-
      - uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          customImage: unityci/editor:ubuntu-6000.3.26f1-webgl-3
          # Metodo ufficiale del Tech Lead (shader, Look48, HUD, scena): output in Builds/WebGL_min
          buildMethod: UltimoMiglio.EditorTools.WebGLMinBuild.Build
          # .lfs-assets-id (cache LFS) rende il working tree "sporco": niente versioning semantico da git
          versioning: None
          allowDirtyBuild: true
      - name: Controllo build non compressa
        run: |
          test -f Builds/WebGL_min/index.html
          if ls Builds/WebGL_min/Build/*.br Builds/WebGL_min/Build/*.gz 2>/dev/null; then echo "::error::Build compressa"; exit 1; fi
      # Il container Unity scrive Builds/ come root: senza chown lo step patch fallisce con "Permission denied" (run 38865499000)
      - name: Permessi sui file della build
        run: sudo chown -R "$(id -u):$(id -g)" Builds
      - name: Patch mobile su index.html (come um-web/pubblica.sh USE_BUILD_INDEX=1)
        run: tools/patch_index_mobile.sh Builds/WebGL_min/index.html
      - name: Deploy su GitHub Pages (B00RR/ultimo-miglio-web) - solo avvio manuale
        if: github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: B00RR/ultimo-miglio-web
          publish_branch: main
          publish_dir: Builds/WebGL_min
          enable_jekyll: false
          force_orphan: true
          commit_message: "Build WebGL da ultimo-miglio@${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: webgl, path: Builds/WebGL_min, retention-days: 3 }

  # Preview automatica su /dev/ (issue #179): solo push su main, copia mirata in dev/ del repo del sito
  deploy-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    # Due deploy dev non si sovrappongono: si accodano (nessuno viene annullato a meta')
    concurrency:
      group: deploy-dev-ultimo-miglio-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools }
      - uses: actions/download-artifact@v4
        with: { name: webgl, path: build-webgl }
      - name: Clona il repo del sito
        uses: actions/checkout@v4
        with:
          repository: B00RR/ultimo-miglio-web
          ref: main
          ssh-key: ${{ secrets.PAGES_DEPLOY_KEY }}
          path: sito
      - name: Prepara dev/ (patch mobile, cap DPR 1.25, etichetta SHA e ora Europe/Rome)
        run: tools/deploy_dev.sh build-webgl sito "$GITHUB_SHA"
      - name: Commit e push solo di dev/
        working-directory: sito
        run: |
          git config user.name "Build & Release"
          git config user.email "build-release@bokobay.invalid"
          git add -A dev
          fuori=$(git status --porcelain | grep -v ' dev/' || true)
          if [ -n "$fuori" ]; then echo "::error::Modifiche fuori da dev/:"; echo "$fuori"; exit 1; fi
          if git diff --cached --quiet; then echo "Nessuna modifica in dev/"; exit 0; fi
          git commit -qm "Preview dev da ultimo-miglio@${GITHUB_SHA::7} ($GITHUB_SHA) - $(TZ=Europe/Rome date '+%d/%m %H:%M')"
          git push -q origin HEAD:main
          echo "Preview: https://b00rr.github.io/ultimo-miglio-web/dev/"
