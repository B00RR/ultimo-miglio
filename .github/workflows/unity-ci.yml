# Pipeline Ultimo Miglio (issue #12)
# - PR verso main: SOLO test EditMode + PlayMode sul runner self-hosted del box (Editor locale, Library persistente) + commento.
# - Push su main e avvio manuale: test + build WebGL (verifica, artifact). Le modifiche solo .md/docs non avviano la CI.
# - Deploy su B00RR/ultimo-miglio-web (GitHub Pages) SOLO con avvio manuale (workflow_dispatch): niente deploy automatico al merge.
# Test e build girano sul runner self-hosted [self-hosted, unity] (box): Editor 6000.3.26f1 locale con licenza già attiva,
# niente container game-ci. tools/ci_unity.sh gestisce lock (/tmp/unity-ci.lock) e attesa di altri Unity (max 20 min).
# Secret richiesti: PAGES_DEPLOY_KEY (deploy key con scrittura sul repo web).
name: Unity CI (WebGL)
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
# Una run per workflow+ref; si annullano solo le run vecchie delle PR, mai i push su main o gli avvii manuali.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UNITY_VERSION: 6000.3.26f1
  TZ: Europe/Rome

jobs:
  test:
    runs-on: [self-hosted, unity]
    timeout-minutes: 60
    steps:
      # Checkout persistente: clean false mantiene Library tra le run
      - uses: actions/checkout@v4
        with: { clean: false, lfs: true }
      - name: Test EditMode + PlayMode (Editor del box, stessa Library)
        run: |
          rm -rf test-results && mkdir -p test-results
          rc=0
          for m in EditMode PlayMode; do
            tools/ci_unity.sh -buildTarget WebGL -runTests -testPlatform $m \
              -testResults "$PWD/test-results/${m,,}-results.xml" -logFile "$PWD/test-results/${m,,}.log" || rc=1
            test -f "test-results/${m,,}-results.xml" || { echo "::error::Risultati $m mancanti"; tail -50 "test-results/${m,,}.log"; rc=1; }
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results }

  commento:
    needs: [test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: test-results, path: test-results }
        continue-on-error: true
      - name: Commenta la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UM_REPO: ${{ github.repository }}
        run: |
          mkdir -p Logs
          for f in $(find test-results -name '*.xml' 2>/dev/null); do
            case "$f" in *[Ee]dit[Mm]ode*) cp "$f" Logs/editmode-results.xml;; *[Pp]lay[Mm]ode*) cp "$f" Logs/playmode-results.xml;; esac
          done
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          tools/pr_comment.sh ${{ github.event.pull_request.number }} "" "$RUN"

  build:
    needs: test
    # Sulle PR niente build WebGL (solo test): build su push a main e avvio manuale, sul box con la stessa Library
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, unity]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { clean: false, lfs: true }
      - name: Build WebGL (UltimoMiglio.EditorTools.WebGLMinBuild.Build -> Builds/WebGL_min)
        run: |
          rm -rf Builds/WebGL_min
          tools/ci_unity.sh -quit -buildTarget WebGL -executeMethod UltimoMiglio.EditorTools.WebGLMinBuild.Build -logFile "$PWD/webgl_build.log" || { tail -80 webgl_build.log; exit 1; }
      - name: Controllo build non compressa
        run: |
          test -f Builds/WebGL_min/index.html
          if ls Builds/WebGL_min/Build/*.br Builds/WebGL_min/Build/*.gz 2>/dev/null; then echo "::error::Build compressa"; exit 1; fi
      - name: Patch mobile su index.html (come um-web/pubblica.sh USE_BUILD_INDEX=1)
        run: tools/patch_index_mobile.sh Builds/WebGL_min/index.html
      - name: Deploy su GitHub Pages (B00RR/ultimo-miglio-web) - solo avvio manuale
        if: github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: B00RR/ultimo-miglio-web
          publish_branch: main
          publish_dir: Builds/WebGL_min
          enable_jekyll: false
          force_orphan: true
          commit_message: "Build WebGL da ultimo-miglio@${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: webgl, path: Builds/WebGL_min, retention-days: 3 }
