# Pipeline Ultimo Miglio (issue #12)
# - Ogni PR verso main: test EditMode + PlayMode (game-ci) e commento con l'esito sulla PR.
# - PR verso main: SOLO test EditMode + PlayMode (una sola invocazione game-ci, testMode: all) + commento.
# - Push su main e avvio manuale: test + build WebGL (verifica, artifact). Le modifiche solo .md/docs non avviano la CI.
# - Deploy su B00RR/ultimo-miglio-web (GitHub Pages) SOLO con avvio manuale (workflow_dispatch): niente deploy automatico al merge.
# game-ci v4 con licenza Personal vuole UNITY_LICENSE (.ulf) + UNITY_EMAIL/UNITY_PASSWORD: senza .ulf la build si ferma con
# "Missing Unity License File and no Serial was found" (run 38865014865). Con la .ulf i test erano verdi (run 38757501264).
# Secret richiesti: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD; PAGES_DEPLOY_KEY (deploy key con scrittura sul repo web).
name: Unity CI (WebGL)
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  checks: write
# Una run per workflow+ref; si annullano solo le run vecchie delle PR, mai i push su main o gli avvii manuali.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UNITY_VERSION: 6000.3.26f1
  TZ: Europe/Rome

jobs:
  licenza:
    runs-on: ubuntu-24.04
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          L: ${{ secrets.UNITY_LICENSE }}
          E: ${{ secrets.UNITY_EMAIL }}
          P: ${{ secrets.UNITY_PASSWORD }}
        run: |
          mancano=""
          [ -n "$L" ] || mancano="$mancano UNITY_LICENSE"
          [ -n "$E" ] || mancano="$mancano UNITY_EMAIL"
          [ -n "$P" ] || mancano="$mancano UNITY_PASSWORD"
          if [ -z "$mancano" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::error::Secret mancanti:$mancano. Vedi LEGGIMI_BUILD.md §3."; exit 1; fi

  test:
    needs: licenza
    if: needs.licenza.outputs.ok == 'true'
    runs-on: ubuntu-24.04
    steps:
      # L'immagine unityci/editor (~15 GB) non entra senza spazio: pulizia limitata alle cartelle più grandi e veloci da togliere
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: false, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      # LFS con cache: si scaricano solo gli oggetti nuovi (risparmio banda LFS)
      - name: Elenco oggetti LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: Library
          # Chiave stabile (progetto nella radice del repo): cambia solo con pacchetti/impostazioni
          key: Library-${{ runner.os }}-test-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-test-
      - uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          # Immagine con modulo WebGL: gli script Editor usano UnityEditor.WebGL
          customImage: unityci/editor:ubuntu-6000.3.26f1-webgl-3
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test Unity
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-results, path: test-results }

  # Catture HUD direzione C (390×844 e 360×800) per la revisione del Concept Artist.
  # Parte dopo i test: la licenza Personal ha un posto solo, non va attivata in parallelo al job test.
  # unity-editor non legge UNITY_LICENSE: come game-ci, il seriale sta in DeveloperData della .ulf.
  catture:
    needs: [licenza, test]
    if: needs.licenza.outputs.ok == 'true' && github.event_name == 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: false, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - name: Elenco oggetti LFS
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-insegna-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-insegna-
            Library-${{ runner.os }}-test-
      - name: Cattura HUD insegna
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64, pathlib
          lic = os.environ["UNITY_LICENSE"]
          key = '<DeveloperData Value="'
          i = lic.find(key)
          if i < 0:
              raise SystemExit("UNITY_LICENSE senza DeveloperData: attesa la .ulf, come per game-ci")
          i += len(key)
          j = lic.find('"/>', i)
          serial = base64.b64decode(lic[i:j]).decode("latin1")[4:]
          pathlib.Path("/tmp/unity-serial").write_text(serial)
          PY
          UNITY_SERIAL="$(tr -d '\r\n' < /tmp/unity-serial)"
          rm -f /tmp/unity-serial
          echo "::add-mask::$UNITY_SERIAL"
          echo "Lunghezza seriale: ${#UNITY_SERIAL}"
          if [ "${#UNITY_SERIAL}" -ne 27 ]; then
            echo "::error::Seriale Unity inatteso: attesi 27 caratteri."
            exit 1
          fi
          mkdir -p Logs Captures/hud "$RUNNER_TEMP/unity-home"
          # Come game-ci: /root deve essere scrivibile, altrimenti la licenza non viene salvata
          # (run 38894532033: «preferences folder could not be created», poi exit 198).
          docker run --rm \
            --user root \
            -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD -e HOME=/root \
            -v "$RUNNER_TEMP/unity-home:/root" \
            -v "$PWD:/project" -w /project \
            --shm-size=1025m \
            --entrypoint /bin/bash \
            unityci/editor:ubuntu-6000.3.26f1-webgl-3 \
            -lc '
              set -e
              mkdir -p /root/.local/share/unity3d /root/.cache/unity3d /root/.config /BlankProject/Assets /project/Logs
              if [[ "$UNITY_SERIAL" == F* ]]; then
                dbus-uuidgen > /etc/machine-id
                mkdir -p /var/lib/dbus
                ln -sf /etc/machine-id /var/lib/dbus/machine-id
              fi
              unity-editor -logFile /project/Logs/insegna-activate.log -quit \
                -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -projectPath /BlankProject
              set +e
              unity-editor -projectPath /project \
                -executeMethod UltimoMiglio.UI.EditorTools.InsegnaCapture.Run \
                -logFile /project/Logs/insegna-capture.log
              code=$?
              unity-editor -logFile /project/Logs/insegna-return.log -quit -returnlicense \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -projectPath /BlankProject || true
              exit $code
            '
      - name: Log cattura se fallisce
        if: failure()
        run: |
          echo "---- activate ----"; tail -n 80 Logs/insegna-activate.log || true
          echo "---- capture ----"; tail -n 160 Logs/insegna-capture.log || true
          echo "---- return ----"; tail -n 40 Logs/insegna-return.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: catture-hud, path: Captures/hud, retention-days: 5 }

  commento:
    needs: [licenza, test]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: test-results, path: test-results }
        continue-on-error: true
      - name: Commenta la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UM_REPO: ${{ github.repository }}
          LICENZA_OK: ${{ needs.licenza.outputs.ok }}
        run: |
          mkdir -p Logs
          for f in $(find test-results -name '*.xml' 2>/dev/null); do
            case "$f" in *[Ee]dit[Mm]ode*) cp "$f" Logs/editmode-results.xml;; *[Pp]lay[Mm]ode*) cp "$f" Logs/playmode-results.xml;; esac
          done
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          [ "$LICENZA_OK" = true ] || export UM_NOTA="⚠️ Test non eseguiti: licenza Unity non configurata nei secret (vedi LEGGIMI_BUILD.md §3)."
          tools/pr_comment.sh ${{ github.event.pull_request.number }} "" "$RUN"

  build:
    needs: licenza
    # Sulle PR niente build WebGL (solo test): build su push a main e avvio manuale
    if: needs.licenza.outputs.ok == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # L'immagine unityci/editor (~15 GB) non entra senza spazio: pulizia limitata alle cartelle più grandi e veloci da togliere
      - uses: jlumbroso/free-disk-space@v1.3.1
        with: { tool-cache: false, android: true, dotnet: true, haskell: true, large-packages: false, docker-images: false, swap-storage: false }
      - uses: actions/checkout@v4
      - run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-${{ hashFiles('Packages/packages-lock.json', 'Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-
      - uses: game-ci/unity-builder@v4.8.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          customImage: unityci/editor:ubuntu-6000.3.26f1-webgl-3
          # Metodo ufficiale del Tech Lead (shader, Look48, HUD, scena): output in Builds/WebGL_min
          buildMethod: UltimoMiglio.EditorTools.WebGLMinBuild.Build
          # .lfs-assets-id (cache LFS) rende il working tree "sporco": niente versioning semantico da git
          versioning: None
          allowDirtyBuild: true
      - name: Controllo build non compressa
        run: |
          test -f Builds/WebGL_min/index.html
          if ls Builds/WebGL_min/Build/*.br Builds/WebGL_min/Build/*.gz 2>/dev/null; then echo "::error::Build compressa"; exit 1; fi
      # Il container Unity scrive Builds/ come root: senza chown lo step patch fallisce con "Permission denied" (run 38865499000)
      - name: Permessi sui file della build
        run: sudo chown -R "$(id -u):$(id -g)" Builds
      - name: Patch mobile su index.html (come um-web/pubblica.sh USE_BUILD_INDEX=1)
        run: tools/patch_index_mobile.sh Builds/WebGL_min/index.html
      - name: Deploy su GitHub Pages (B00RR/ultimo-miglio-web) - solo avvio manuale
        if: github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: B00RR/ultimo-miglio-web
          publish_branch: main
          publish_dir: Builds/WebGL_min
          enable_jekyll: false
          force_orphan: true
          commit_message: "Build WebGL da ultimo-miglio@${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: webgl, path: Builds/WebGL_min, retention-days: 3 }
